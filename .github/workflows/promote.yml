name: Promote to Staging

on:
  workflow_run:
    workflows:
      - Docker Build
    types:
      - completed

jobs:
  deploy:
    name: Deploy Docker image to staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy image to staging
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          kubectl apply --namespace staging -f deployment.yml
          kubectl --namespace staging set image deployment/python-app \
            python-app=myintwl/python-app:${IMAGE_TAG}
          kubectl --namespace staging rollout status deployment/python-app --timeout=180s
