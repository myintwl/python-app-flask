name: Promote to Staging

on:
  workflow_run:
    workflows:
      - Docker Build
    types:
      - completed

jobs:
  deploy:
    name: Deploy Docker image to staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: staging

    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure EKS access
        env:
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Deploy image to staging
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          kubectl apply --namespace staging -f deployment.yml
          kubectl --namespace staging set image deployment/python-app \
            python-app=myintwl/python-app:${IMAGE_TAG}
          kubectl --namespace staging rollout status deployment/python-app --timeout=180s
