name: Create Release

on:
  workflow_run:
    workflows:
      - Promote to Staging
    types:
      - completed

jobs:
  release:
    name: Create GitHub release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.event.workflow_run.run_number }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          generate_release_notes: true
          body: |
            Promoted to staging from commit `${{ github.event.workflow_run.head_sha }}`.

            Docker image:
            `myintwl/python-app:${{ github.event.workflow_run.head_sha }}`
